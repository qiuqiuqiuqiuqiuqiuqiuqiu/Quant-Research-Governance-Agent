[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-governance-agent"
version = "0.1.0"
description = "A minimal, auditable agent framework for quantitative research governance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]

[project.scripts]
quant-governance = "quant_governance_agent.cli:main"

[tool.setuptools.packages.find]
include = ["quant_governance_agent*"]
